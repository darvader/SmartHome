plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.darvader.livescore'
    compileSdk 35

    defaultConfig {
        minSdk 26
        targetSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        // PERFORMANCE: Enable multidex for faster builds
        multiDexEnabled true

        // PERFORMANCE: Optimize vector drawables
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            // PERFORMANCE: Disable unnecessary features in debug builds
            minifyEnabled false
            jniDebuggable false
            renderscriptDebuggable false
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // PERFORMANCE: Enable incremental annotation processing
        incremental true
    }

    kotlinOptions {
        jvmTarget = '11'
        // PERFORMANCE: Enable incremental compilation
    }

    buildFeatures {
        viewBinding true
        // PERFORMANCE: Disable unused features
        dataBinding false
        renderScript false
        aidl false
        compose false
    }

    // PERFORMANCE: Optimize lint for faster builds
    lint {
        abortOnError false
        checkReleaseBuilds false
        checkTestSources false
        checkDependencies false
        disable 'InvalidPackage', 'UnusedResources'
    }

    // PERFORMANCE: Optimize packaging
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // WebSocket dependencies - Standardized versions
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Moshi for JSON parsing
    implementation 'com.squareup.moshi:moshi:1.15.2'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
