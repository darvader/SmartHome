apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    compileSdk 35

    defaultConfig {
        namespace 'com.darvader.smarthome'
        applicationId "com.darvader.smarthome"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // PERFORMANCE: Enable multidex for faster builds
        multiDexEnabled true

        // PERFORMANCE: Optimize vector drawables
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            // PERFORMANCE: Disable unnecessary features in debug builds
            minifyEnabled false
            shrinkResources false
            debuggable true
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false

            // PERFORMANCE: Skip lint checks in debug builds
            lintOptions.checkReleaseBuilds = false
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        compose true
        // PERFORMANCE: Disable unused features
        dataBinding false
        renderScript false
        aidl false
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.15"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // PERFORMANCE: Enable incremental annotation processing
        incremental true
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    // PERFORMANCE: Optimize packaging
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/versions/**']
        }
    }

    // PERFORMANCE: Optimize lint for faster builds
    lint {
        abortOnError false
        checkReleaseBuilds false
        checkTestSources false
        checkDependencies false
        disable 'InvalidPackage', 'UnusedResources', 'IconDensities'
    }

    // Remove deprecated android.enableBuildCache option
    // Gradle build cache is now used instead via gradle.properties

    // Remove deprecated dexOptions - replaced with newer configuration
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Add livescore module dependency - CORRECT dependency direction
    implementation project(':livescore')

    // WebSocket - Standardized version for consistency
    implementation "org.java-websocket:Java-WebSocket:1.5.7"
    // Moshi - Updated to latest
    implementation 'com.squareup.moshi:moshi:1.15.2'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.2'

    implementation 'com.github.wseemann:FFmpegMediaMetadataRetriever-core:1.0.21'
    implementation 'com.github.wseemann:FFmpegMediaMetadataRetriever-native:1.0.21'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // CameraX - Updated to latest stable
    def camerax_version = "1.4.0"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // OkHttp - Compatible version for Kotlin 2.0.21
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.slf4j:slf4j-simple:2.0.17'

    // Compose BOM - Updated to latest stable
    def composeBom = platform("androidx.compose:compose-bom:2024.09.03")
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation(composeBom)
    androidTestImplementation(composeBom)

    // Compose dependencies - all using BOM versions
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.material:material")
    implementation("androidx.compose.foundation:foundation")
    implementation("androidx.compose.ui:ui")

    // Android Studio Preview support
    implementation("androidx.compose.ui:ui-tooling-preview")
    debugImplementation("androidx.compose.ui:ui-tooling")

    // UI Tests
    androidTestImplementation("androidx.compose.ui:ui-test-junit4")
    debugImplementation("androidx.compose.ui:ui-test-manifest")

    // Material Icons
    implementation("androidx.compose.material:material-icons-core")
    implementation("androidx.compose.material:material-icons-extended")
    implementation("androidx.compose.material3:material3-window-size-class")

    // Activity and Lifecycle integration - Compatible versions
    implementation("androidx.activity:activity-compose:1.9.2")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
    implementation("androidx.compose.runtime:runtime-livedata")
    implementation("androidx.compose.runtime:runtime-rxjava2")

    testImplementation 'junit:junit:4.13.2'
}
